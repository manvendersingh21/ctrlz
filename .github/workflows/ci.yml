name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · lint · unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Enable pnpm (version from packageManager field)
        run: corepack enable pnpm

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

  e2e:
    name: e2e scenario (standalone server + Atlas Local)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      atlas:
        image: mongodb/mongodb-atlas-local:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping: 1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
    env:
      MONGODB_URI: mongodb://localhost:27017/?directConnection=true
      NEXT_TELEMETRY_DISABLED: "1"
      # The scenario fires more POSTs than the default per-IP limit allows from one runner.
      CTRLZ_RATE_LIMIT_PER_MIN: "1000"
    steps:
      - uses: actions/checkout@v5

      - name: Enable pnpm (version from packageManager field)
        run: corepack enable pnpm

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (standalone)
        run: pnpm build

      # The Dockerfile does the same two copies; standalone needs static assets
      - name: Assemble standalone bundle
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public

      - name: Start server
        run: |
          nohup node .next/standalone/server.js > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for /api/health
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://localhost:3000/api/health > /dev/null; then
              echo "healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::server never became healthy"
          cat server.log || true
          exit 1

      - name: E2E scenario
        env:
          CTRLZ_URL: http://localhost:3000
        run: pnpm test:e2e

      - name: Server log
        if: failure()
        run: cat server.log || true

  docker:
    name: docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ctrlz:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
